[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gantry-harness"
version = "0.1.0"
description = "An agent harness: loop contract, tool registry, transport, sandbox, verification and telemetry."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "jsonschema>=4.20",
]

[project.optional-dependencies]
azure = ["openai>=1.40"]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.27"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.5"]

[project.scripts]
gantry = "gantry.cli.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gantry = ["telemetry/*.sql", "telemetry/*.json", "api/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = ["live: requires real Azure OpenAI credentials"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
# S (bandit) and BLE (blind except) are enabled deliberately: this project
# executes model-chosen commands and must never swallow an error silently.
# Every suppression below carries a reason at its call site.
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "S", "BLE"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Tests assert, and construct deliberately hostile inputs.
"tests/**" = ["S101", "S108", "S603", "S607"]
